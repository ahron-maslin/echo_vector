[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "echo_vector"
dynamic = ["version"]
description = "Search audio by meaning: concept search over recorded speech, and text-to-sound search"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "EchoVector Contributors" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
keywords = ["audio", "search", "embeddings", "semantic", "vector", "FAISS", "CLAP"]
dependencies = [
    "numpy>=1.26,<3",
    "pydantic>=2.5,<3",
    "soundfile>=0.12,<1",
    "soxr>=0.3,<1",
    "faiss-cpu>=1.7,<2",
    "typer>=0.12,<1",
    "rich>=13.7,<14",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
# PyTorch and transformers add roughly 4 GB (the Linux wheels pull CUDA by
# default), which is a hard sell for someone trying a CLI on a whim. They are
# needed only by the model backends -- clap, wav2vec2, hubert, ast -- so the
# base install stays small and asks for them by name.
clap = [
    "echo_vector[formats]",
    "torch>=2.1,<3",
    "transformers>=4.36,<5",
]
# librosa decodes formats libsndfile cannot (m4a/aac), but pulls numba and
# llvmlite -- around 345 MB -- so it is not carried just in case. WAV, FLAC,
# OGG, and (with a recent libsndfile) MP3 need nothing extra.
formats = [
    "librosa>=0.10,<1",
]
# Concept search over spoken recordings: transcribe once, embed the text, and
# expand queries by sound. No PyTorch -- faster-whisper and fastembed run on
# CTranslate2 and ONNX.
speech = [
    "faster-whisper>=1.0,<2",
    "fastembed>=0.3,<1",
    "phonemizer>=3.2,<4",
    "espeakng-loader>=0.2,<1",
    "rapidfuzz>=3.6,<4",
]
api = [
    "fastapi>=0.109,<1",
    "uvicorn[standard]>=0.27,<1",
]
dev = [
    "echo_vector[clap,speech]",
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "pytest-asyncio>=0.23,<1",
    "pytest-xdist>=3.5,<4",
    "httpx2>=2.0,<3",
    "hypothesis>=6.92,<7",
    "mutmut>=2.4,<3",
    "ruff>=0.15,<1",
    "mypy>=1.8,<2",
    "pre-commit>=3.6,<4",
]
all = ["echo_vector[api,clap,dev,formats]"]

[project.scripts]
echovector = "echovector.cli.main:app"

[project.urls]
Homepage = "https://github.com/ahron-maslin/echo_vector"
Documentation = "https://github.com/ahron-maslin/echo_vector#readme"
Repository = "https://github.com/ahron-maslin/echo_vector"
Issues = "https://github.com/ahron-maslin/echo_vector/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["echovector"]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "N",            # pep8-naming
    "UP",           # pyupgrade
    "B",            # flake8-bugbear
    "SIM",          # flake8-simplify
    "TCH",          # flake8-type-checking
    "RUF",          # Ruff-specific
    "D",            # pydocstyle
    "ANN",          # flake8-annotations
    "S",            # flake8-bandit
    "C4",           # flake8-comprehensions
    "PT",           # flake8-pytest-style
    "RET",          # flake8-return
    "ARG",          # flake8-unused-arguments
]
ignore = [
    "D100", "D104", "D107",  # missing docstrings in some places
    "ANN401",                 # Any is intentional in **kwargs and config helpers
    "S101",                   # assert usage (fine in tests)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN", "S101", "S603", "ARG", "E501", "PT011"]
"echovector/api/server.py" = ["B008"]
"benchmarks/**/*.py" = ["S311"]  # sampling a corpus, not generating secrets

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "faiss",
    "faster_whisper",
    "fastembed",
    "phonemizer",
    "phonemizer.*",
    "espeakng_loader",
    "rapidfuzz.*",
    "librosa",
    "librosa.*",
    "soundfile",
    "transformers",
    "transformers.*",
    "soxr",
    "torch",
    "torch.*",
    "torchaudio",
    "torchaudio.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["echovector.api.server"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "e2e: marks end-to-end tests",
    "performance: marks performance/benchmark tests",
    "gpu: marks tests that require GPU",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pkg_resources",
    "ignore::DeprecationWarning:numba",
    "ignore::UserWarning:librosa",
]

[tool.coverage.run]
source = ["echovector"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@overload",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.mutmut]
paths_to_mutate = "echovector/"
tests_dir = "tests/"
